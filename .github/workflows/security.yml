name: security

on:
  schedule:
    - cron: '0 12 * * 1'   # Mondays 12:00 UTC
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gitleaks:
    name: secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    # OSV-Scanner via official Docker image. No install dance, no GHAS
    # dependency, no SARIF upload. Findings surface in the job log.
    name: OSV-Scanner
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/google/osv-scanner:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        # `scan source` enumerates manifests/lockfiles; OSV-Scanner v2 dropped
        # the standalone --skip-git flag.
        run: /osv-scanner scan source --recursive ./
